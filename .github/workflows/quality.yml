name: Python quality

on:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYSX_EXTENSIONS_DIR: ${{ github.workspace }}/.vscode-test/extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-host-${{ runner.os }}-1.140.0-pylance-2026.4.1
      - run: uv python install 3.14.4
      - run: uv sync --locked --python 3.14.4
      - run: uv run --project . python scripts/verify.py all
