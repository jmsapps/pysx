name: Python quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYSX_EXTENSIONS_DIR: ${{ github.workspace }}/.vscode-test/extensions
      PYSX_DEPLOYMENT_LOGS: ${{ github.workspace }}/.pysx-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-host-${{ runner.os }}-1.140.0-pylance-2026.4.1
      - run: uv python install 3.14.4
      - run: uv sync --locked --python 3.14.4
      - run: uv run --project . python scripts/verify.py all
      # The failure evidence lives in fixture and container logs that the
      # suites delete on teardown, so it is collected whatever the result.
      - name: Collect fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-logs-${{ matrix.os }}
          path: .pysx-logs/
          if-no-files-found: warn
          retention-days: 7
