worker_processes 1;
events { worker_connections 1024; }
http {
    access_log off;
    error_log /dev/stderr crit;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $arg_owner $owner_group {
        worker-a owner_a;
        worker-b owner_b;
        default workers;
    }
    upstream workers {
        server worker-a:8750 max_fails=1 fail_timeout=1s;
        server worker-b:8750 max_fails=1 fail_timeout=1s;
    }
    upstream owner_a {
        server worker-a:8750 max_fails=1 fail_timeout=1s;
        server worker-b:8750 backup;
    }
    upstream owner_b {
        server worker-b:8750 max_fails=1 fail_timeout=1s;
        server worker-a:8750 backup;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_header_timeout 5s;
        client_body_timeout 5s;
        send_timeout 5s;
        client_max_body_size 64k;
        location = /health { return 200 'ok'; }
        location /_pysx/ { return 404; }
        location /_fixture/ { return 404; }
        location / {
            proxy_pass http://$owner_group;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For '';
            proxy_set_header Forwarded '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_read_timeout 65s;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 2s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
