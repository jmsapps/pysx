[project]
name = "pysx-tutorial"
version = "0.7.1"
description = "An interactive course in server-side Python interfaces"
requires-python = ">=3.14"
dependencies = ["pysx-framework==0.7.1"]

[project.optional-dependencies]
editor = ["pysx-framework[lsp]==0.7.1"]
asgi = ["pysx-framework[asgi]==0.7.1"]

[project.scripts]
pysx-tutorial = "src:main"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[tool.uv.sources]
pysx-framework = { path = ".artifacts/pysx_framework-0.7.1-py3-none-any.whl" }
