<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="554" viewBox="0 0 1048 554" role="img" aria-labelledby="title desc">
  <title id="title">PYSX reactive counter</title>
  <desc id="desc">Python counter with a typed increment handler and syntax-highlighted PYSX template.</desc>
  <rect width="1048" height="554" rx="8" fill="#1f1f1f"/>
  <g fill="none" stroke="#404040" stroke-width="1">
    <path d="M94 154v388 M152 226v72 M152 370v144 M210 406v108 M268 478v36"/>
  </g>
  <g font-family="'Cascadia Code', 'DejaVu Sans Mono', Consolas, monospace" font-size="24" xml:space="preserve">
    <g fill="#6e7681" text-anchor="end">
      <text x="52" y="34">1</text><text x="52" y="70">2</text><text x="52" y="106">3</text>
      <text x="52" y="142">4</text><text x="52" y="178">5</text><text x="52" y="214">6</text>
      <text x="52" y="250">7</text><text x="52" y="286">8</text><text x="52" y="322">9</text>
      <text x="52" y="358">10</text><text x="52" y="394">11</text><text x="52" y="430">12</text>
      <text x="52" y="466">13</text><text x="52" y="502">14</text><text x="52" y="538">15</text>
    </g>
    <g fill="#cccccc">
      <text x="94" y="34"><tspan fill="#c586c0">from</tspan> <tspan fill="#4ec9b0">pysx</tspan> <tspan fill="#c586c0">import</tspan> <tspan fill="#4ec9b0">Fragment</tspan>, <tspan fill="#dcdcaa">pysx</tspan>, <tspan fill="#dcdcaa">signal</tspan></text>
      <text x="94" y="142"><tspan fill="#569cd6">def</tspan> <tspan fill="#dcdcaa">app</tspan><tspan fill="#ffd700">()</tspan> -&gt; <tspan fill="#4ec9b0">Fragment</tspan>:</text>
      <text x="152" y="178"><tspan fill="#9cdcfe">count</tspan> = <tspan fill="#dcdcaa">signal</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffd700">)</tspan></text>
      <text x="152" y="250"><tspan fill="#569cd6">def</tspan> <tspan fill="#dcdcaa">increment</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#9cdcfe">_e</tspan>: <tspan fill="#4ec9b0">object</tspan><tspan fill="#ffd700">)</tspan> -&gt; <tspan fill="#569cd6">None</tspan>:</text>
      <text x="210" y="286"><tspan fill="#9cdcfe">count</tspan>.<tspan fill="#dcdcaa">set</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#9cdcfe">count</tspan><tspan fill="#da70d6">()</tspan> + <tspan fill="#b5cea8">1</tspan><tspan fill="#ffd700">)</tspan></text>
      <text x="152" y="358"><tspan fill="#c586c0">return</tspan> <tspan fill="#dcdcaa">pysx</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#569cd6">t</tspan>"""</text>
      <text x="210" y="394"><tspan fill="#569cd6">div</tspan><tspan fill="#c586c0">:</tspan></text>
      <text x="268" y="430"><tspan fill="#569cd6">p</tspan><tspan fill="#c586c0">:</tspan> <tspan fill="#ce9178">"Count: "</tspan> <tspan fill="#da70d6">{</tspan><tspan fill="#9cdcfe">count</tspan><tspan fill="#da70d6">}</tspan></text>
      <text x="268" y="466"><tspan fill="#569cd6">button</tspan><tspan fill="#da70d6">(</tspan><tspan fill="#9cdcfe">onClick</tspan>=<tspan fill="#179fff">{</tspan><tspan fill="#dcdcaa">increment</tspan><tspan fill="#179fff">}</tspan><tspan fill="#da70d6">)</tspan><tspan fill="#c586c0">:</tspan></text>
      <text x="326" y="502" fill="#ce9178">"Increment"</text>
      <text x="152" y="538">"""<tspan fill="#ffd700">)</tspan></text>
    </g>
  </g>
</svg>
